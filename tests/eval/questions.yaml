# Live evaluation against a real model (scripts/live_eval.py).
# `expect`: any of these (case-insensitive) in the answer counts as correct.
# `min_expect`: how many of `expect` must appear (default 1).
# `forbid`: names that must NOT appear in the answer (a wrong answer).
# `other_teachers_students`: must never appear as sources for this teacher (privacy).
# `model`: ask with this teacher-selectable model (skipped, with a note, unless /api/models
#   offers it); the answer must come from that model.
# `attach`: a file (relative to this folder) uploaded as the teacher's private document and
#   attached to the question; one of its passages must be among the sources.
teacher: jordan.lee@maplegrove.demo
other_teachers_students: [Grace Lewis, Daniel Walker, Layla Hassan, Jack Young, Chloe King,
  Samuel Wright, Nora Scott, Leo Green, Hana Sato, David Adams]
questions:
  - q: What is the late work policy?
    expect: ["80%", "80 percent"]
  - q: Where do students take tests in a separate setting?
    expect: ["114", "Learning Center"]
  - q: How much extended time do students usually get on tests?
    expect: ["1.5"]
  - q: When is the Unit 2 test in ELA?
    expect: ["October 28", "Oct 28", "Oct. 28", "2026-10-28", "10/28"]
  - q: When is the final draft of the argumentative essay due?
    expect: ["October 23", "Oct 23", "Oct. 23", "2026-10-23", "10/23"]
  - q: Which of my students have an IEP?
    expect: ["Ava Thompson", "Lucas Martin", "Mateo Hernandez", "Aaliyah Jackson"]
    min_expect: 2
    # Jordan's students without an IEP: naming any of them is a wrong answer
    forbid: [Liam Okafor, Sofia Ramirez, Noah Kim, Mia Johnson, Ethan Nguyen, Isabella Rossi,
      Amara Diallo, Oliver Brown, Charlotte Davis, Harper Wilson, Elijah Moore, Zara Ahmed,
      James Taylor, Benjamin Lee, Camila Torres, Henry Clark]
  - q: Which of my students get extended time on tests?
    expect: ["Ava Thompson", "Mia Johnson", "Amara Diallo", "Mateo Hernandez", "Elijah Moore", "Aaliyah Jackson"]
    min_expect: 3
    forbid: [Liam Okafor, Sofia Ramirez, Noah Kim, Ethan Nguyen, Isabella Rossi, Lucas Martin,
      Oliver Brown, Charlotte Davis, Harper Wilson, Zara Ahmed, James Taylor, Benjamin Lee,
      Camila Torres, Henry Clark]
  - q: When is Mateo Hernandez's plan review date?
    expect: ["October 27", "Oct 27", "2026-10-27", "10/27"]
  - q: What accommodations does Camila Torres have?
    expect: ["glossary", "sentence frames", "picture"]
  - q: What happens on a second cell phone violation?
    expect: ["office"]
  - q: What accommodations does Daniel Walker have?
    # Daniel is in another teacher's class: the answer must not reveal his plan
    expect: ["couldn't find", "could not find", "not in your", "no information", "don't have", "not listed", "not found"]
  - q: What is the school's mascot?
    expect: ["couldn't find", "could not find", "not in your", "no information", "don't have", "not mentioned", "not found"]
  - q: How many tardies lead to a detention?
    model: qwen3:4b  # "Thorough"
    expect: ["three", "3"]
  - q: When are the permission forms for the museum trip due?
    attach: field-trip-permission.md
    expect: ["November 7", "Nov 7", "Nov. 7", "11/7"]
