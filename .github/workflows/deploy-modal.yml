# Deploys the GPU runtime to Modal, downloads the models, and proves it with the live eval.
#
# One-time setup — add three repository secrets (Settings → Secrets and variables → Actions):
#   MODAL_TOKEN_ID, MODAL_TOKEN_SECRET  from modal.com → Settings → API Tokens → New token
#   LS_RUNTIME_TOKEN                    any long random string (e.g. `openssl rand -hex 24`);
#                                       paste the same value into Admin → Runtime → Access token
# Also deploys the hosted Local School app (server + web UI) next to the runtime, so
# testers only need a link. Optional secret LS_ADMIN_PASSWORD sets the first admin's
# password (otherwise LS_RUNTIME_TOKEN is used).
name: Deploy Modal runtime

permissions:
  contents: read   # download the Mac app release for the hosted app

on:
  workflow_dispatch:
    inputs:
      gpu:
        description: "GPU type (L4, A10G, T4) or none for CPU-only. Any GPU needs a payment method on the Modal account."
        default: none
      chat_model:
        description: "Chat model to pull and evaluate (use qwen3:1.7b with gpu=none)"
        default: qwen3:1.7b
      school_name:
        description: School name shown in the hosted app
        default: Maple Grove Middle School
      demo:
        description: "Load the fictional demo school and show 'Try the demo' on the login page"
        type: boolean
        default: true
      whisper_model:
        description: "Speech-to-text model for meeting notes (CPU, int8): base.en, small.en, …"
        default: base.en

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      LS_RUNTIME_TOKEN: ${{ secrets.LS_RUNTIME_TOKEN }}
      LS_GPU: ${{ inputs.gpu || 'none' }}
      CHAT: ${{ inputs.chat_model || 'qwen3:1.7b' }}
      EMBED: nomic-embed-text
      THOROUGH: qwen3:4b-instruct-2507-q4_K_M
      WHISPER_MODEL: ${{ inputs.whisper_model || 'base.en' }}
      # The meeting-notes check's recording, and the facts its notes must contain.
      MEETING_TEXT: "This is an IEP meeting for Ava Thompson. We agreed to add a daily check-in with Ms. Rivera starting Monday."
    steps:
      - name: Check secrets
        id: secrets
        run: |
          if [ -z "$MODAL_TOKEN_ID" ] || [ -z "$MODAL_TOKEN_SECRET" ] || [ -z "$LS_RUNTIME_TOKEN" ]; then
            {
              echo "### Modal runtime not deployed: secrets missing"
              echo "Add repository secrets **MODAL_TOKEN_ID**, **MODAL_TOKEN_SECRET** (modal.com → Settings → API Tokens)"
              echo "and **LS_RUNTIME_TOKEN** (any long random string), then run this workflow again."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ready == 'true'

      - uses: actions/setup-python@v5
        if: steps.secrets.outputs.ready == 'true'
        with:
          python-version: "3.12"

      - name: Make a test recording (espeak-ng)
        if: steps.secrets.outputs.ready == 'true'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq espeak-ng >/dev/null
          espeak-ng -s 150 -w "$RUNNER_TEMP/meeting.wav" "$MEETING_TEXT"
          ls -l "$RUNNER_TEMP/meeting.wav"

      - name: Deploy
        if: steps.secrets.outputs.ready == 'true'
        id: deploy
        run: |
          pip install -q modal
          modal secret create localschool-runtime LS_RUNTIME_TOKEN="$LS_RUNTIME_TOKEN" --force
          modal deploy deploy/modal/ollama_app.py 2>&1 | tee deploy.log
          if grep -q "add a payment method" deploy.log; then
            {
              echo "### Modal needs a payment method for GPUs"
              echo "Add one at modal.com → Settings → Billing (the free monthly credit still applies),"
              echo "or rerun this workflow with **gpu = none** and **chat_model = qwen3:1.7b** for a CPU-only runtime."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          URL=$(grep -oE 'https://[A-Za-z0-9.-]+\.modal\.run' deploy.log | head -1)
          test -n "$URL" || { echo "could not find the endpoint URL"; exit 1; }
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Pull models onto the runtime volume
        if: steps.secrets.outputs.ready == 'true'
        run: |
          modal run deploy/modal/ollama_app.py::pull --model "$CHAT"
          modal run deploy/modal/ollama_app.py::pull --model "$EMBED"
          # Teachers' "Thorough" choice (config/models.yaml); the live eval asks it one question.
          if [ "$CHAT" != "$THOROUGH" ]; then modal run deploy/modal/ollama_app.py::pull --model "$THOROUGH"; fi
          # Speech-to-text weights for meeting notes (WHISPER_MODEL, cached on the same volume).
          modal run deploy/modal/ollama_app.py::pull_whisper --model "$WHISPER_MODEL"

      - name: Wake the runtime and check auth
        if: steps.secrets.outputs.ready == 'true'
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          test "$(curl -s -o /dev/null -w '%{http_code}' --max-time 300 "$URL/api/version")" = 401
          curl -sf --max-time 300 -H "Authorization: Bearer $LS_RUNTIME_TOKEN" "$URL/api/version"
          curl -sf -H "Authorization: Bearer $LS_RUNTIME_TOKEN" "$URL/api/tags" | python -c "import json,sys;print([m['name'] for m in json.load(sys.stdin)['models']])"
          # Speech-to-text behind the same token: OpenAI verbose_json with timed segments.
          test "$(curl -s -o /dev/null -w '%{http_code}' -F file=@"$RUNNER_TEMP/meeting.wav" "$URL/v1/audio/transcriptions")" = 401
          curl -sf --max-time 600 -H "Authorization: Bearer $LS_RUNTIME_TOKEN" \
            -F file=@"$RUNNER_TEMP/meeting.wav" -F model=whisper -F response_format=verbose_json \
            "$URL/v1/audio/transcriptions" | python -c "import json,sys;d=json.load(sys.stdin);assert not d.get('error'),d;assert d['segments'],d;print([(s['start'],s['end'],s['text']) for s in d['segments']])"

      - uses: actions/setup-node@v4
        if: steps.secrets.outputs.ready == 'true'
        with:
          node-version: 22

      - name: Mac app for teachers (served by the hosted app)
        if: steps.secrets.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The repo's release downloads need a GitHub sign-in; teachers don't have one, so the
          # hosted app serves the zip itself (/install/LocalSchool-macOS.zip, used by mac.sh).
          if gh release download --repo "$GITHUB_REPOSITORY" --pattern LocalSchool-macOS.zip -D "$RUNNER_TEMP/mac" --clobber; then
            modal volume put localschool-app-data "$RUNNER_TEMP/mac/LocalSchool-macOS.zip" /downloads/LocalSchool-macOS.zip --force
            echo "uploaded $(du -h "$RUNNER_TEMP/mac/LocalSchool-macOS.zip" | cut -f1) Mac app zip"
          else
            echo "No Mac release yet; teachers can use the browser until one is published."
          fi

      - name: Deploy the hosted app (server + web UI)
        if: steps.secrets.outputs.ready == 'true'
        id: app
        env:
          RUNTIME: ${{ steps.deploy.outputs.url }}
          ADMIN_PW: ${{ secrets.LS_ADMIN_PASSWORD || secrets.LS_RUNTIME_TOKEN }}
          SCHOOL: ${{ inputs.school_name || 'Maple Grove Middle School' }}
          DEMO: ${{ inputs.demo == false && '0' || '1' }}
        run: |
          (cd web && npm ci --no-audit --no-fund && npm run build)
          modal secret create localschool-app --force \
            ADMIN_EMAIL=admin@school.local ADMIN_PASSWORD="$ADMIN_PW" \
            RUNTIME_URL="$RUNTIME" RUNTIME_TOKEN="$LS_RUNTIME_TOKEN" \
            CHAT_MODEL="$CHAT" EMBED_MODEL="$EMBED" SCHOOL_NAME="$SCHOOL" \
            LS_SEED_DEMO="$DEMO" MAC_APP_URL="https://github.com/${{ github.repository }}/releases/latest/download/LocalSchool-macOS.zip" DEMO_LOGINS="$([ "$DEMO" = 1 ] && echo true || echo false)" >/dev/null
          modal deploy deploy/modal/web_app.py 2>&1 | tee app.log
          APP=$(grep -oE 'https://[A-Za-z0-9.-]*localschool-app[A-Za-z0-9.-]*\.modal\.run' app.log | head -1)
          test -n "$APP" || { echo "could not find the app URL"; exit 1; }
          echo "url=$APP" >> "$GITHUB_OUTPUT"
          for i in $(seq 1 30); do curl -sf --max-time 60 "$APP/api/health" && break; sleep 5; done
          curl -sf "$APP/api/health"
          curl -sf "$APP/" | grep -q '<div id="root">'

      - name: Live eval through the hosted app (chat + teacher tools)
        if: steps.secrets.outputs.ready == 'true' && inputs.demo != false
        env:
          APP: ${{ steps.app.outputs.url }}
          ADMIN_PW: ${{ secrets.LS_ADMIN_PASSWORD || secrets.LS_RUNTIME_TOKEN }}
        run: |
          pip install -q httpx pyyaml
          # Teachers choose between the two models this run pulled.
          python - <<'PY'
          import os, httpx
          c = httpx.Client(base_url=os.environ["APP"], timeout=60)
          c.post("/api/auth/login", json={"email": "admin@school.local", "password": os.environ["ADMIN_PW"]}).raise_for_status()
          c.put("/api/admin/models/choices", json={"default": os.environ["CHAT"], "options": [
              {"model": os.environ["CHAT"], "label": "Fast", "description": "Quick answers in a few seconds."},
              {"model": os.environ["THOROUGH"], "label": "Thorough", "description": "Takes a little longer; better for tricky questions."},
          ]}).raise_for_status()
          PY
          # --tools: parent email, adapt, feedback, and meeting notes from the espeak-ng
          # recording (uploaded to the app → transcribed by the runtime → notes by the model).
          python -m scripts.live_eval --base "$APP" --admin "admin@school.local:$ADMIN_PW" --min-score 0.75 \
            --tools --audio "$RUNNER_TEMP/meeting.wav" --audio-expect "check-in|check in,monday,rivera" --cleanup

      - name: Hosted app logs (on failure)
        if: failure() && steps.secrets.outputs.ready == 'true'
        run: timeout 30 modal app logs localschool-app 2>&1 | tail -150 || true

      - name: Connection details
        if: steps.secrets.outputs.ready == 'true'
        env:
          URL: ${{ steps.deploy.outputs.url }}
          APP: ${{ steps.app.outputs.url }}
        run: |
          {
            echo "### Local School is live ✅"
            echo ""
            echo "**Share this link with testers:** $APP"
            echo ""
            echo "- Sign in as admin: \`admin@school.local\` with your \`LS_ADMIN_PASSWORD\` secret (or \`LS_RUNTIME_TOKEN\` if you didn't set one). Change it under the key icon."
            echo "- Testers can press **Try the demo** on the login page (fictional school), or you add them in Admin → People."
            echo "- Model runtime: \`$URL\` · compute: $LS_GPU · models: \`$CHAT\`, \`$EMBED\`, speech-to-text \`$WHISPER_MODEL\` · both apps sleep when idle."
          } >> "$GITHUB_STEP_SUMMARY"
