# Builds "Teacher's Desk.app" for Apple Silicon + Intel (universal), then smoke-tests it on a
# real Mac: installs the server with scripts/install-server-mac.sh (launchd), launches the
# app (Bonjour discovery), installs it the way teachers do (curl one-liner from the
# server), signs in, asks a question, and tries ⌥Space. Screenshots are pushed to the
# `ci/screenshots` branch and uploaded as an artifact.
#
# Signing: ad-hoc by default (free; no Apple Developer ID). For browser-download installs
# without a Gatekeeper prompt, optionally add APPLE_CERTIFICATE (base64 .p12),
# APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY, APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID.
#
# Push a tag like desktop-v0.1.0, or run it by hand with "release" set, to publish the
# .dmg and .zip as the latest release (the hosted /get page and installers link there).
name: Desktop (macOS)

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish as a release with this tag (e.g. desktop-v0.1.0); empty = build only"
        required: false
        default: ""
  push:
    tags: ["desktop-v*"]
  pull_request:
    paths:
      - "desktop/**"
      - "web/**"
      - "scripts/install-*.sh"
      - "scripts/setup-local-mac.sh"
      - "scripts/fake_idp.py"
      - "app/**"
      - "app/routes/install.py"
      - ".github/workflows/desktop-macos.yml"

permissions:
  contents: write

jobs:
  build-and-smoke:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      APP: desktop/src-tauri/target/universal-apple-darwin/release/bundle/macos/Teacher's Desk.app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Install CLI
        working-directory: desktop
        run: npm ci

      - name: Bundle the server (for "Keep my data on this Mac")
        run: ./desktop/stage-server.sh

      # Before cargo: tauri-build needs bundle.externalBin (bin/td-call-audio-<triple>) to exist.
      - name: Build the call-audio helper (Swift, ScreenCaptureKit, universal)
        run: ./desktop/helpers/build-call-audio.sh

      - name: Unit tests
        working-directory: desktop/src-tauri
        run: cargo test

      - name: Build universal app
        working-directory: desktop
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "No Developer ID secrets: ad-hoc signing."
            unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
          fi
          npx tauri build --target universal-apple-darwin

      - name: Verify signature + package zip (for curl / MDM installs)
        run: |
          codesign --verify --deep --strict --verbose=2 "$APP"
          # Meeting recording in the app's web view needs the microphone usage description.
          plutil -extract NSMicrophoneUsageDescription raw "$APP/Contents/Info.plist"
          plutil -extract NSAudioCaptureUsageDescription raw "$APP/Contents/Info.plist"
          # Call audio: the helper is in the app, universal, and signed.
          HELPER="$APP/Contents/MacOS/td-call-audio"
          test -x "$HELPER"
          lipo -archs "$HELPER" | grep -q arm64
          lipo -archs "$HELPER" | grep -q x86_64
          codesign --verify --strict --verbose=2 "$HELPER"
          codesign -dv "$APP" 2>&1 | grep -E "Identifier|Signature|Format"
          for b in "$APP/Contents/MacOS/"*; do echo "$(basename "$b"): $(lipo -archs "$b")"; done
          ditto -c -k --keepParent "$APP" LocalSchool-macOS.zip
          ls -lh LocalSchool-macOS.zip desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg

      - name: Call-audio helper runs (READY…SAVED, or the permission error; never hangs)
        run: |
          HELPER="$APP/Contents/MacOS/td-call-audio"
          OUT="$RUNNER_TEMP/call-audio.txt"
          # stdin stays open for 3 s, then closes (= Stop). macOS has no `timeout`: kill at 30 s.
          (sleep 3) | "$HELPER" "$RUNNER_TEMP/call.m4a" > "$OUT" 2> "$RUNNER_TEMP/call-audio.err" &
          PID=$!
          ( sleep 30; kill -9 $PID ) >/dev/null 2>&1 &   # a hang shows as exit 137
          WATCHDOG=$!
          set +e; wait $PID; CODE=$?; set -e
          kill $WATCHDOG 2>/dev/null || true
          echo "exit $CODE"; cat "$OUT"; cat "$RUNNER_TEMP/call-audio.err" || true
          if grep -q "^READY" "$OUT"; then
            test $CODE -eq 0
            grep -q "^SAVED" "$OUT"
            ls -l "$RUNNER_TEMP/call.m4a" 2>/dev/null || echo "(no sound played: no file)"
          else
            # Runners can't grant Screen & System Audio Recording: the teacher-facing message.
            test $CODE -eq 1
            grep -q "^ERROR .*Screen & System Audio Recording" "$OUT"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: LocalSchool-macOS
          path: |
            LocalSchool-macOS.zip
            desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

      # ---------------------------------------------------------------- real-Mac smoke test

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the server with the real installer (launchd, demo school)
        env:
          LS_NONINTERACTIVE: "1"
          SCHOOL_NAME: The Shipley School
          ADMIN_EMAIL: admin@shipley.demo
          ADMIN_PASSWORD: admin-pass-123
          RUNTIME_KIND: fake
          LS_SEED_DEMO: "1"
          PYTHON: python3
        run: LS_APP_ZIP="$PWD/LocalSchool-macOS.zip" ./scripts/install-server-mac.sh

      - name: Smoke test on macOS
        run: |
          mkdir -p shots
          shot() { sleep "${2:-2}"; screencapture -x "shots/$1.png" || echo "screencapture failed for $1"; }
          keys() { osascript -e "tell application \"System Events\" to $1" || echo "keystrokes not permitted: $1"; }

          sw_vers | tee shots/macos.txt
          curl -sf http://127.0.0.1:8000/api/health | tee -a shots/macos.txt

          # 1) First launch, nothing saved: opens the built-in hosted server (desktop/default-server.txt).
          open "$APP"
          shot 1-first-launch-built-in-server 20

          osascript -e "tell application \"Teacher's Desk\" to quit" || true
          sleep 3; pkill -f "Desk.app/Contents/MacOS" || true

          # 2) Teacher install, exactly as documented (pre-connects to this server).
          curl -fsSL http://127.0.0.1:8000/install/mac.sh | bash
          xattr -l "/Applications/Teacher's Desk.app" | tee -a shots/macos.txt || true
          shot 2-installed-autoconnect-signin 15

          # 3) Sign in as a teacher and ask a question.
          osascript -e "tell application \"Teacher's Desk\" to activate"
          sleep 1
          keys 'keystroke "jordan.lee@shipley.demo"'
          keys 'keystroke tab'
          keys 'keystroke "demo-pass-123"'
          keys 'keystroke return'
          shot 3-signed-in 6
          keys 'keystroke "What is the late work policy?"'
          keys 'keystroke return'
          shot 4-answer 6

          # 4) ⌘3 → Roster, then hide the app and bring it back with ⌥Space.
          keys 'keystroke "3" using command down'
          shot 5-roster-cmd3 3
          keys 'keystroke "h" using command down'
          sleep 2
          keys 'key code 49 using option down'
          shot 6-option-space-ask 3

          cp ~/Library/Logs/LocalSchool/server.log shots/server.log 2>/dev/null || true
          ls -la shots

      - name: Keep my data on this Mac (the app's bundled setup, end to end)
        run: |
          APP_INSTALLED="/Applications/Teacher's Desk.app"
          SETUP="$APP_INSTALLED/Contents/Resources/server/scripts/setup-local-mac.sh"
          test -f "$SETUP"
          test "$(cat "$APP_INSTALLED/Contents/Resources/server/VERSION")" = "$(defaults read "$APP_INSTALLED/Contents/Info.plist" CFBundleShortVersionString)"
          # What the app does: sign in to the school's server (the demo school on :8000) for
          # this Mac's key, then set up with the school's AI through its relay.
          D=$(curl -sf -H 'content-type: application/json' \
              -d '{"email":"jordan.lee@shipley.demo","password":"demo-pass-123","label":"CI Mac"}' \
              http://127.0.0.1:8000/api/auth/device)
          eval "$(echo "$D" | python3 -c 'import json,shlex,sys; d=json.load(sys.stdin); print(" ".join(f"export {k}={shlex.quote(d[v])}" for k, v in [("TEACHER_NAME","name"),("TEACHER_EMAIL","email"),("SCHOOL_NAME","school"),("RUNTIME_URL","relay_url"),("RUNTIME_TOKEN","key"),("CHAT_MODEL","chat_model"),("EMBED_MODEL","embed_model")]))')"
          export TEACHER_PASSWORD="demo-pass-123" RUNTIME_KIND=relay
          LOCAL="$HOME/Library/Application Support/org.localschool.desktop/local"

          # Without disk encryption it refuses (teachers are told to turn on FileVault).
          if ! fdesetup status | grep -q "is On"; then
            out=$(bash "$SETUP" || true); echo "$out"
            echo "$out" | grep -q "^ERROR Turn on FileVault"
            test ! -f "$LOCAL/server.env"
          fi

          time LS_ALLOW_NO_FILEVAULT=1 bash "$SETUP" | tee shots/local-setup.txt
          grep -q "^READY http://127.0.0.1:8765" shots/local-setup.txt
          H=$(curl -sf http://127.0.0.1:8765/api/health); echo "$H"; echo "$H" | grep -q '"local":true'
          # Only this Mac can reach it, and the password isn't kept on disk.
          # (`! cmd` never fails a step under set -e, hence the ifs)
          if curl -sf --max-time 3 "http://$(ipconfig getifaddr en0 || echo 192.0.2.1):8765/api/health"; then exit 1; fi
          if grep -q ADMIN_PASSWORD "$LOCAL/server.env"; then exit 1; fi
          test "$(stat -f %Lp "$LOCAL")" = 700 && test "$(stat -f %Lp "$LOCAL/server.env")" = 600

          # The teacher signs in, adds a document, asks about it.
          J=$RUNNER_TEMP/jar
          curl -sf -c $J -H 'content-type: application/json' -d '{"email":"jordan.lee@shipley.demo","password":"demo-pass-123"}' http://127.0.0.1:8765/api/auth/login
          curl -sf -b $J http://127.0.0.1:8765/api/auth/me | grep -q '"Jordan Lee"'
          printf '# Field trip\n\nPermission slips are due Friday.\n' > "$RUNNER_TEMP/trip.md"
          curl -sf -b $J -F "files=@$RUNNER_TEMP/trip.md" http://127.0.0.1:8765/api/documents
          ls "$LOCAL/data"; test -f "$LOCAL/data/localschool.db"
          # Answered by the school's AI through the relay, from this Mac's own document.
          for i in $(seq 1 30); do curl -sf -b $J http://127.0.0.1:8765/api/documents | grep -q '"ready"' && break; sleep 1; done
          A=$(curl -sfN -b $J -H 'content-type: application/json' -d '{"question":"When are permission slips due?"}' http://127.0.0.1:8765/api/chat)
          echo "$A" | tail -5; echo "$A" | grep -q Friday
          grep -c "/api/relay/" ~/Library/Logs/LocalSchool/server.log

          # A meeting kept on this Mac: notepad, call track (6 MB, so it reaches the school's
          # AI in pieces) + mic, notes with "You"/"Others", then a question about it.
          python3 -c 'import wave,sys
          for n,s in (("call",190),("mic",2)):
              w=wave.open(sys.argv[1]+"/"+n+".wav","wb"); w.setnchannels(1); w.setsampwidth(2); w.setframerate(16000); w.writeframes(b"\0\0"*16000*s); w.close()' "$RUNNER_TEMP"
          M=$(curl -sf -b $J -H 'content-type: application/json' -d '{"meeting_type":"iep","consent":true}' http://127.0.0.1:8765/api/tools/meeting/drafts | python3 -c 'import json,sys; print(json.load(sys.stdin)["draft"]["id"])')
          curl -sf -b $J -X PUT -H 'content-type: application/json' -d '{"text":"Call the family about homework"}' http://127.0.0.1:8765/api/meetings/$M/notepad
          curl -sf -b $J -H 'content-type: audio/wav' --data-binary @"$RUNNER_TEMP/call.wav" "http://127.0.0.1:8765/api/meetings/$M/audio?track=call" >/dev/null
          curl -sf -b $J -H 'content-type: audio/wav' --data-binary @"$RUNNER_TEMP/mic.wav" "http://127.0.0.1:8765/api/meetings/$M/audio" >/dev/null
          for i in $(seq 1 60); do curl -sf -b $J http://127.0.0.1:8765/api/drafts/$M | grep -q '"status":"ready"' && break; sleep 1; done
          curl -sf -b $J http://127.0.0.1:8765/api/drafts/$M | tee shots/local-meeting.json | python3 -c 'import json,sys; d=json.load(sys.stdin)["draft"]; assert d["status"]=="ready", d["status"]; assert {s.get("speaker") for s in d["transcript"]}=={"You","Others"}; assert d["output"]["my_notes"]'
          curl -sf -b $J -H 'content-type: application/json' -d '{"question":"What about homework?"}' http://127.0.0.1:8765/api/meetings/$M/ask | tee -a shots/local-meeting.json
          grep -c "/api/relay/transcribe/part" ~/Library/Logs/LocalSchool/server.log

          # The app opens it (connect screen → this Mac).
          mkdir -p "$HOME/Library/Application Support/org.localschool.desktop"
          printf '{"url":"http://127.0.0.1:8765","name":"The Shipley School"}' > "$HOME/Library/Application Support/org.localschool.desktop/server.json"
          osascript -e "tell application \"Teacher's Desk\" to quit" || true
          sleep 3; pkill -f "Desk.app/Contents/MacOS" || true
          open "$APP_INSTALLED"; sleep 12; screencapture -x shots/7-local-signin.png || true
          osascript -e "tell application \"System Events\" to keystroke \"jordan.lee@shipley.demo\"" -e "tell application \"System Events\" to keystroke tab" \
                    -e "tell application \"System Events\" to keystroke \"demo-pass-123\"" -e "tell application \"System Events\" to keystroke return" || true
          sleep 6; screencapture -x shots/8-local-signed-in.png || true

          # Server stopped (crash, logout): the app's next connect restarts it via launchd.
          launchctl kickstart -k "gui/$(id -u)/org.localschool.desk"
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8765/api/health >/dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:8765/api/health >/dev/null

          # A new app version refreshes the code and keeps the data.
          echo 0.0.0 > "$LOCAL/server/VERSION"
          LS_UPDATE=1 LS_ALLOW_NO_FILEVAULT=1 bash "$SETUP" | tail -2
          curl -sf -b $J http://127.0.0.1:8765/api/documents | grep -q "trip"
          test "$(cat "$LOCAL/server/VERSION")" != 0.0.0

          # The school's admin can cut this Mac off from its AI.
          AJ=$RUNNER_TEMP/admin
          curl -sf -c $AJ -H 'content-type: application/json' -d '{"email":"admin@shipley.demo","password":"admin-pass-123"}' http://127.0.0.1:8000/api/auth/login >/dev/null
          DEV=$(curl -sf -b $AJ http://127.0.0.1:8000/api/admin/devices | python3 -c 'import json,sys; print(json.load(sys.stdin)["devices"][0]["id"])')
          curl -sf -b $AJ -X DELETE http://127.0.0.1:8000/api/admin/devices/$DEV
          curl -sfN -b $J -H 'content-type: application/json' -d '{"question":"When are slips due?"}' http://127.0.0.1:8765/api/chat | grep -q "removed this Mac"

          # Removing it deletes this Mac's copy.
          LS_REMOVE=1 bash "$SETUP"
          test ! -d "$LOCAL"
          if curl -sf --max-time 3 http://127.0.0.1:8765/api/health; then exit 1; fi
          cp ~/Library/Logs/"Teachers Desk"/*.log shots/ 2>/dev/null || true

      - name: Sign in with Google (fake provider) in the Mac app, and "keep my data" with it
        run: |
          APP_INSTALLED="/Applications/Teacher's Desk.app"
          S=http://127.0.0.1:8000
          # The demo school uses a stand-in Google on :9999.
          python3 scripts/fake_idp.py 9999 jordan.lee@shipley.demo > "$RUNNER_TEMP/idp.log" 2>&1 &
          echo 'SSO_ENDPOINTS_OVERRIDE={"google":{"auth":"http://127.0.0.1:9999/auth","token":"http://127.0.0.1:9999/token","issuer":"http://127.0.0.1:9999"}}' >> .env
          launchctl kickstart -k "gui/$(id -u)/org.localschool.server"
          for i in $(seq 1 60); do curl -sf $S/api/health >/dev/null && break; sleep 1; done
          AJ=$RUNNER_TEMP/admin2
          curl -sf -c $AJ -H 'content-type: application/json' -d '{"email":"admin@shipley.demo","password":"admin-pass-123"}' $S/api/auth/login >/dev/null
          curl -sf -b $AJ -X PUT -H 'content-type: application/json' \
            -d '{"google_client_id":"ci-client","google_client_secret":"ci-secret-123","domains":"shipley.demo"}' $S/api/admin/sso | grep -q '"enabled":\["google"\]'
          curl -sf $S/api/health | grep -q '"sso":\["google"\]'

          # 1) The Mac app's sign-in: the browser part (curl here), then the teachersdesk:// link.
          printf '{"url":"%s","name":"The Shipley School"}' "$S" > "$HOME/Library/Application Support/org.localschool.desktop/server.json"
          osascript -e "tell application \"Teacher's Desk\" to quit" || true; sleep 3; pkill -f "Desk.app/Contents/MacOS" || true
          open "$APP_INSTALLED"; sleep 10
          screencapture -x shots/9-login-with-google.png || true
          START=$(curl -sf "$S/api/auth/sso/google/start?mode=app&json=1" | python3 -c 'import json,sys; print(json.load(sys.stdin)["url"])')
          PAGE=$(curl -sfL "$START")
          CODE=$(echo "$PAGE" | grep -oE 'teachersdesk://signin\?code=[A-Za-z0-9_-]+' | head -1 | cut -d= -f2)
          test -n "$CODE"
          open "teachersdesk://signin?code=$CODE"; sleep 6
          screencapture -x shots/10-signed-in-with-google.png || true
          # The app used the one-time code: it no longer works.
          test "$(curl -s -o /dev/null -w '%{redirect_url}' "$S/api/auth/sso/redeem?code=$CODE")" = "$S/"
          curl -sf -b $AJ "$S/api/admin/activity?q=Google" | grep -q '"sso_sign_in"'

          # 2) "Keep my data on this Mac" with Google: the link sets up this Mac's desk, the
          #    app keeps its password in the Keychain and opens it already signed in.
          launchctl setenv LS_ALLOW_NO_FILEVAULT 1   # CI runners have no FileVault
          osascript -e "tell application \"Teacher's Desk\" to quit" || true; sleep 3; pkill -f "Desk.app/Contents/MacOS" || true
          open "$APP_INSTALLED"; sleep 8
          START=$(curl -sf "$S/api/auth/sso/google/start?mode=desk&json=1" | python3 -c 'import json,sys; print(json.load(sys.stdin)["url"])')
          CODE=$(curl -sfL "$START" | grep -oE 'teachersdesk://desk\?code=[A-Za-z0-9_-]+' | head -1 | cut -d= -f2)
          test -n "$CODE"
          open "teachersdesk://desk?code=$CODE"
          for i in $(seq 1 240); do curl -sf http://127.0.0.1:8765/api/health | grep -q '"local":true' && break; sleep 1; done
          curl -sf http://127.0.0.1:8765/api/health | grep -q '"local":true'
          sleep 8; screencapture -x shots/11-desk-from-google.png || true
          security find-generic-password -s "Teacher's Desk (this Mac)" -a jordan.lee@shipley.demo >/dev/null
          LOCAL="$HOME/Library/Application Support/org.localschool.desktop/local"
          test "$(cat "$LOCAL/account")" = jordan.lee@shipley.demo
          grep -q '^RUNTIME_KIND=relay' "$LOCAL/server.env"
          launchctl unsetenv LS_ALLOW_NO_FILEVAULT
          # Clean up: removal also deletes the Keychain entry.
          LS_REMOVE=1 bash "$APP_INSTALLED/Contents/Resources/server/scripts/setup-local-mac.sh"
          if security find-generic-password -s "Teacher's Desk (this Mac)" >/dev/null 2>&1; then exit 1; fi
          cp ~/Library/Logs/"Teachers Desk"/*.log shots/ 2>/dev/null || true

      - name: The app updates itself from the school's server
        run: |
          APP_INSTALLED="/Applications/Teacher's Desk.app"
          DATA="$HOME/Library/Application Support/LocalSchoolServer"
          UPD="$HOME/Library/Application Support/org.localschool.desktop/update"
          # A "newer" release: this same app, marked 9.9.9 and re-signed, served by the school.
          rm -rf "$RUNNER_TEMP/new" && mkdir -p "$RUNNER_TEMP/new" && cp -R "$APP_INSTALLED" "$RUNNER_TEMP/new/"
          plutil -replace CFBundleShortVersionString -string 9.9.9 "$RUNNER_TEMP/new/Teacher's Desk.app/Contents/Info.plist"
          codesign --force --deep -s - "$RUNNER_TEMP/new/Teacher's Desk.app"
          (cd "$RUNNER_TEMP/new" && ditto -c -k --keepParent "Teacher's Desk.app" "$DATA/downloads/LocalSchool-macOS.zip")
          curl -sf http://127.0.0.1:8000/api/health | grep -q '"mac_app_version":"9.9.9"'

          printf '{"url":"http://127.0.0.1:8000","name":"The Shipley School"}' > "$HOME/Library/Application Support/org.localschool.desktop/server.json"
          osascript -e "tell application \"Teacher's Desk\" to quit" || true; sleep 3; pkill -f "Desk.app/Contents/MacOS" || true
          open "$APP_INSTALLED"
          # It notices, downloads and checks the update in the background…
          for i in $(seq 1 180); do test -f "$UPD/ready" && break; sleep 1; done
          test "$(cat "$UPD/ready")" = 9.9.9
          # …and puts it in place when the teacher quits.
          osascript -e "tell application \"Teacher's Desk\" to quit"
          for i in $(seq 1 60); do pgrep -f "Desk.app/Contents/MacOS" >/dev/null || break; sleep 1; done
          for i in $(seq 1 30); do test "$(defaults read "$APP_INSTALLED/Contents/Info.plist" CFBundleShortVersionString)" = 9.9.9 && break; sleep 1; done
          test "$(defaults read "$APP_INSTALLED/Contents/Info.plist" CFBundleShortVersionString)" = 9.9.9
          codesign --verify --deep --strict "$APP_INSTALLED"
          test ! -d "$UPD"
          open "$APP_INSTALLED"; sleep 10; pgrep -f "Desk.app/Contents/MacOS" >/dev/null
          screencapture -x shots/12-after-update.png || true

      - name: Publish screenshots (branch ci/screenshots)
        if: always()
        env:
          TOKEN: ${{ github.token }}
        run: |
          [ -d shots ] || exit 0
          cd shots
          echo "macOS smoke screenshots for ${GITHUB_SHA} (${GITHUB_REF})" > README.md
          git init -q -b ci/screenshots
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "macOS smoke screenshots for ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci/screenshots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-smoke-screenshots
          path: shots
          if-no-files-found: ignore

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/desktop-v') || inputs.release != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release || github.ref_name }}
        run: |
          gh release create "$TAG" --target "$GITHUB_SHA" --title "Teacher's Desk for Mac ${TAG#desktop-v}" \
            --notes "Universal (Apple Silicon + Intel). Install: \`curl -fsSL <your Teacher's Desk link>/install/mac.sh | bash\`, or see <your link>/get." || true
          gh release upload "$TAG" LocalSchool-macOS.zip \
            desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg --clobber
