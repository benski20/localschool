# Builds "Local School.app" + .dmg for Apple Silicon and Intel Macs (universal binary).
# Run it from the Actions tab, or push a tag like desktop-v0.1.0 to attach the DMG to a release.
#
# Optional signing/notarization (recommended before rolling out to a district) — add repo secrets:
#   APPLE_CERTIFICATE (base64 .p12), APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
#   APPLE_ID, APPLE_PASSWORD (app-specific), APPLE_TEAM_ID
# Without them the build is unsigned (fine for a pilot: right-click → Open the first time).
name: Desktop (macOS)

on:
  workflow_dispatch:
  push:
    tags: ["desktop-v*"]
  pull_request:
    paths: ["desktop/**", ".github/workflows/desktop-macos.yml"]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Install CLI
        working-directory: desktop
        run: npm ci

      - name: Unit tests
        working-directory: desktop/src-tauri
        run: cargo test

      - name: Build universal app
        working-directory: desktop
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "No signing secrets: building an unsigned app."
            unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
          fi
          npx tauri build --target universal-apple-darwin

      - uses: actions/upload-artifact@v4
        with:
          name: LocalSchool-macOS
          path: desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "Local School for Mac ${GITHUB_REF_NAME#desktop-v}" --notes "Universal (Apple Silicon + Intel)." || true
          gh release upload "$GITHUB_REF_NAME" desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg --clobber
