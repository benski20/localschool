<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Local School</title>
    <link rel="stylesheet" href="connect.css" />
  </head>
  <body>
    <div class="titlebar" data-tauri-drag-region></div>

    <main class="wrap">
      <svg class="logo" width="44" height="44" viewBox="0 0 64 64" aria-hidden="true">
        <rect width="64" height="64" rx="14" class="logo-bg" />
        <path d="M18 44V20h6v18.5h14V44H18z" class="logo-fg" />
        <rect x="40" y="20" width="6" height="12" rx="1.5" fill="#6B8AF0" />
      </svg>

      <!-- Reconnecting to the saved server -->
      <section id="view-checking" class="view" hidden>
        <h1 id="checking-title">Connecting…</h1>
        <p class="sub"><span class="spinner" aria-hidden="true"></span><span id="checking-host"></span></p>
      </section>

      <!-- Saved server unreachable -->
      <section id="view-unreachable" class="view" hidden>
        <h1 id="unreachable-title">Can't reach your school server</h1>
        <p class="sub" id="unreachable-body"></p>
        <div class="actions">
          <button class="btn btn-secondary" id="choose-other">Choose another server</button>
          <button class="btn btn-primary" id="retry">Try again</button>
        </div>
      </section>

      <!-- First run / switch -->
      <section id="view-choose" class="view" hidden>
        <h1>Connect to your school</h1>
        <p class="sub">Local School answers from your school's own server. No AI models run on this Mac.</p>

        <div class="card">
          <div class="card-head">
            <span class="eyebrow">On this network</span>
            <button class="link" id="rescan">Search again</button>
          </div>
          <ul id="found" class="found" aria-live="polite"></ul>
          <p id="scan-status" class="muted small"></p>
        </div>

        <form id="manual" class="card" autocomplete="off">
          <label for="address" class="label">Server address</label>
          <div class="row">
            <input id="address" class="input" placeholder="maplegrove.local:8000 or https://…" spellcheck="false" />
            <button class="btn btn-primary" id="connect" type="submit">Connect</button>
          </div>
          <p id="error" class="error" role="alert" hidden></p>
          <p class="muted small">Your IT administrator can give you this address.</p>
        </form>
      </section>
    </main>

    <footer class="foot"><span aria-hidden="true">🔒</span> Student data stays on your school's servers.</footer>
    <script src="connect.js"></script>
  </body>
</html>
