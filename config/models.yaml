# Recommended models, shown as one-click presets on the Admin → Models page.
# Any Ollama model tag works; these are the ones we've sized for pilot GPUs.
presets:
  chat:
    - name: qwen3:1.7b
      label: Fast
      note: Quick answers in a few seconds, even without a GPU. The hosted pilot's default.
    - name: qwen3:4b
      label: Thorough
      note: Better on tricky questions; about 10–15 s per answer on CPU, quick on any GPU.
    - name: qwen3:8b
      label: GPU default
      note: Good default with a GPU. Runs well on a 16–24 GB GPU (T4, L4, A10G).
    - name: gpt-oss:20b
      label: Quality
      note: Best answers. Needs ~16 GB of GPU memory; use an L4/A10G or larger.
  embed:
    - name: nomic-embed-text
      label: Default
      note: Small and fast. Switching embed models re-indexes your library automatically.
    - name: mxbai-embed-large
      label: Higher recall
      note: Larger embedding model; slower indexing.

# Chat models teachers can pick from on the Ask page. Loaded once, on first start (when
# the list is empty); after that admins edit it in Settings → AI. Only models installed
# on the runtime are offered.
choices:
  - model: qwen3:1.7b
    label: Fast
    description: Quick answers in a few seconds.
  - model: qwen3:4b
    label: Thorough
    description: Takes a little longer; better for tricky questions.
